services:
  costume-tryon:
    build:
      context: ./backend
      dockerfile: manifest/docker/Dockerfile
    container_name: costume-tryon-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      # 可在根目录或 backend 目录配置 .env 注入对应 Key
      - GF_SERVER_ADDRESS=:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ARK_API_KEY=${ARK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
